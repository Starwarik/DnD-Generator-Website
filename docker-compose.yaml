services:

  web:
    build: ./backend
    ports:
      - 8004:8000
    volumes:
      - ./backend/app:/code/app
    env_file: ".env"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: unless-stopped  
    depends_on:
      - redis

