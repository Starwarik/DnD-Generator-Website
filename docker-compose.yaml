services:

  db_postgres:
    image: postgres:latest
    container_name: postgres_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: DB
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata  
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DB"]
      interval: 30s
      timeout: 10s
      retries: 5
    secrets:
      - postgres_password

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    image: noihat/dnd-web:1 
    ports:
      - "8004:8000"
    env_file: ".env"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1  
        delay: 10s  
        order: start-first  
        max_failure_ratio: 0.1  
    depends_on:
      - db_postgres
      - redis

  worker:
    image: noihat/dnd-worker:1 
    env_file: ".env"
    command: celery -A worker.main:celery_app worker --loglevel=INFO
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1  
        delay: 10s 
        order: start-first  
        max_failure_ratio: 0.1 
    depends_on:
      - web
      - redis
      - db_postgres

volumes:
  pgdata:
    driver: local

secrets:
  postgres_password:
    external: true