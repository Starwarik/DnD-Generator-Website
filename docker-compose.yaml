services:

  db_postgres:
    image: postgres:latest
    container_name: postgres_db_container
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: DB
        PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata  
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d DB" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    profiles:
     - backend
     - production

  redis:
    image: redis:7
    expose:
      - "6379:6379"
    profiles:
     - backend
     - production


  web:
    build: ./backend
    ports:
      - 8004:8000
    env_file: ".env"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: unless-stopped  
    depends_on:
      - redis
      - db_postgres
    profiles:
     - backend
     - production


  worker:
    build: ./worker
    env_file: ".env"
    command: celery -A worker.main:celery_app worker --loglevel=INFO
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      - web
      - redis
      - db_postgres
    profiles:
     - backend
     - production

  frontend:
    build: ./frontend
    volumes:
      - type: bind
        source: frontend/letsencrypt/live/adventuregenerator.ru
        target: /etc/letsencrypt/live/adventuregenerator.ru
    profiles:
     - frontend
     - production
    ports:
      - 443:443

volumes:
  pgdata:
    driver: local